name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kira
          POSTGRES_PASSWORD: kira_test
          POSTGRES_DB: kira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kira -d kira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kira:kira_test@localhost:5432/kira_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint and format check
        run: ruff check . && ruff format --check .
      - name: Tests (PostgreSQL included, coverage gate 90 %)
        run: pytest -q
